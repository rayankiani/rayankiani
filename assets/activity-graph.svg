<svg xmlns="http://www.w3.org/2000/svg" width="990" height="215" viewBox="0 0 990 215" fill="none">
  <rect x="0.5" y="0.5" rx="10" width="989" height="214" fill="#0D1117" stroke="#30363D"/>

  <g transform="translate(30, 35)">
    <text x="0" y="0" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="600" font-size="18" fill="#58A6FF">
      Contribution &amp; Commit Activity Graph
      <animate attributeName="fill" values="#58A6FF;#3FB950;#58A6FF" dur="6s" repeatCount="indefinite" />
    </text>
  </g>

  <g transform="translate(30, 55)">
    <!-- Horizontal Grid lines -->
    <line x1="0" y1="30" x2="930" y2="30" stroke="#21262D" stroke-dasharray="4"/>
    <line x1="0" y1="70" x2="930" y2="70" stroke="#21262D" stroke-dasharray="4"/>
    <line x1="0" y1="110" x2="930" y2="110" stroke="#21262D" stroke-dasharray="4"/>

    <!-- Area chart fill polygon -->
    <polygon points="0,110 132,85 265,45 397,35 530,30 662,65 795,40 930,20 930,130 0,130" fill="#58A6FF" fill-opacity="0.15">
      <animate attributeName="fill-opacity" values="0.15;0.25;0.15" dur="3s" repeatCount="indefinite"/>
    </polygon>

    <!-- Line Chart stroke -->
    <polyline points="0,110 132,85 265,45 397,35 530,30 662,65 795,40 930,20" fill="none" stroke="#58A6FF" stroke-width="3">
      <animate attributeName="stroke" values="#58A6FF;#3FB950;#58A6FF" dur="4s" repeatCount="indefinite"/>
    </polyline>

    <!-- Glowing points with pulse animation -->
    <circle cx="0" cy="110" r="5" fill="#58A6FF"/>
    <circle cx="132" cy="85" r="5" fill="#58A6FF"/>
    <circle cx="265" cy="45" r="5" fill="#3FB950"/>
    <circle cx="397" cy="35" r="5" fill="#58A6FF"/>
    <circle cx="530" cy="30" r="6" fill="#3FB950">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="662" cy="65" r="5" fill="#58A6FF"/>
    <circle cx="795" cy="40" r="5" fill="#58A6FF"/>
    <circle cx="930" cy="20" r="6" fill="#3FB950">
      <animate attributeName="r" values="6;10;6" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Month Labels -->
    <text x="0" y="148" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="12" fill="#8B949E" text-anchor="middle">Jan</text>
    <text x="132" y="148" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="12" fill="#8B949E" text-anchor="middle">Feb</text>
    <text x="265" y="148" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="12" fill="#8B949E" text-anchor="middle">Mar</text>
    <text x="397" y="148" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="12" fill="#8B949E" text-anchor="middle">Apr</text>
    <text x="530" y="148" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="12" fill="#8B949E" text-anchor="middle">May</text>
    <text x="662" y="148" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="12" fill="#8B949E" text-anchor="middle">Jun</text>
    <text x="795" y="148" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="12" fill="#8B949E" text-anchor="middle">Jul</text>
    <text x="930" y="148" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="12" fill="#8B949E" text-anchor="middle">Aug</text>
  </g>
</svg>
