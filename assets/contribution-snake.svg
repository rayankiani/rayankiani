    <!-- ANIMATED SNAKE ELEMENT -->
    <!-- The neon snake head and body moving along a path -->
    <path id="snakePath" d="M6,6 L350,6 L350,22 L150,22 L150,38 L450,38 L450,54 L50,54 Z" fill="none" stroke="none"/>

    <!-- Animated Snake Head -->
    <circle r="6" fill="#58A6FF">
      <animateMotion dur="8s" repeatCount="indefinite">
        <mpath href="#snakePath"/>
      </animateMotion>
    </circle>
    
    <!-- Animated Snake Body Segment 1 -->
    <circle r="5" fill="#39D353" opacity="0.8">
      <animateMotion dur="8s" repeatCount="indefinite" begin="-0.2s">
        <mpath href="#snakePath"/>
      </animateMotion>
    </circle>

    <!-- Animated Snake Body Segment 2 -->
    <circle r="4" fill="#26A641" opacity="0.6">
      <animateMotion dur="8s" repeatCount="indefinite" begin="-0.4s">
        <mpath href="#snakePath"/>
      </animateMotion>
    </circle>

    <!-- Animated Snake Body Segment 3 -->
    <circle r="3" fill="#006D32" opacity="0.4">
      <animateMotion dur="8s" repeatCount="indefinite" begin="-0.6s">
        <mpath href="#snakePath"/>
      </animateMotion>
