<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" fill="none">
  <rect width="1000" height="280" rx="16" fill="#0A0E17" stroke="#1F293D" stroke-width="2"/>

  <!-- Background Cyber Grid Lines -->
  <g stroke="#161F33" stroke-width="1" opacity="0.6">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="100" y1="0" x2="100" y2="280" />
    <line x1="250" y1="0" x2="250" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="550" y1="0" x2="550" y2="280" />
    <line x1="700" y1="0" x2="700" y2="280" />
    <line x1="850" y1="0" x2="850" y2="280" />
  </g>

  <!-- Animated Glowing Laser Scanner Line -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="#58A6FF" stroke-width="2" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,280" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="140" r="120" fill="#58A6FF" opacity="0.08">
    <animate attributeName="r" values="100;140;100" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="140" r="130" fill="#3FB950" opacity="0.08">
    <animate attributeName="r" values="110;150;110" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Decorative Corner Accents -->
  <path d="M20 50 L20 20 L50 20" stroke="#58A6FF" stroke-width="3" fill="none"/>
  <path d="M980 50 L980 20 L950 20" stroke="#58A6FF" stroke-width="3" fill="none"/>
  <path d="M20 230 L20 260 L50 260" stroke="#3FB950" stroke-width="3" fill="none"/>
  <path d="M980 230 L980 260 L950 260" stroke="#3FB950" stroke-width="3" fill="none"/>

  <!-- Main Name Title -->
  <g transform="translate(500, 115)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="900" font-size="46" letter-spacing="4" fill="#E6EDF3">
      RAYAN ALI KAYANI
      <animate attributeName="fill" values="#E6EDF3;#58A6FF;#E6EDF3" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(500, 160)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="600" font-size="18" letter-spacing="2" fill="#58A6FF">
      FULL-STACK ENGINEER &nbsp;·&nbsp; CREATIVE DEVELOPER &nbsp;·&nbsp; AI PIONEER
      <animate attributeName="fill" values="#58A6FF;#3FB950;#58A6FF" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Live Status Badge Bar -->
  <g transform="translate(500, 215)">
    <rect x="-240" y="-18" width="480" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <!-- Animated Pulsing Green Status Dot -->
    <circle cx="-210" cy="-1" r="5" fill="#3FB950">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-195" y="4" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="600" font-size="13" fill="#C9D1D9">
      BUILDING HIGH-PERFORMANCE WEB &amp; AI SYSTEMS
    </text>
  </g>
</svg>
