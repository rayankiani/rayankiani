<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215" fill="none">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58A6FF; }
    .number { font: 700 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #3FB950; }
    .label { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8B949E; }
    .subtext { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #6E7681; }
  </style>

  <rect x="0.5" y="0.5" rx="10" width="494" height="214" fill="#0D1117" stroke="#30363D"/>

  <g transform="translate(0, 35)">
    <text x="247" y="0" text-anchor="middle" class="title">GitHub Contribution Streak</text>
  </g>

  <g transform="translate(25, 65)">
    <!-- Column 1: Total Contributions -->
    <rect x="0" y="0" width="138" height="110" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="69" y="32" text-anchor="middle" class="label">TOTAL</text>
    <text x="69" y="65" text-anchor="middle" class="number">1,240+</text>
    <text x="69" y="90" text-anchor="middle" class="subtext">2025 - Present</text>

    <!-- Column 2: Current Streak -->
    <rect x="153" y="0" width="138" height="110" rx="8" fill="#161B22" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="222" y="32" text-anchor="middle" class="label" fill="#58A6FF">CURRENT STREAK</text>
    <text x="222" y="65" text-anchor="middle" class="number" fill="#58A6FF">42 Days 🔥</text>
    <text x="222" y="90" text-anchor="middle" class="subtext">Active Daily</text>

    <!-- Column 3: Longest Streak -->
    <rect x="306" y="0" width="138" height="110" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="375" y="32" text-anchor="middle" class="label">LONGEST STREAK</text>
    <text x="375" y="65" text-anchor="middle" class="number" fill="#D29922">86 Days ⚡</text>
    <text x="375" y="90" text-anchor="middle" class="subtext">All-Time Peak</text>
  </g>
</svg>
