<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215" fill="none">
  <rect x="0.5" y="0.5" rx="10" width="494" height="214" fill="#0D1117" stroke="#30363D"/>

  <g transform="translate(0, 35)">
    <text x="247" y="0" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="600" font-size="18" fill="#58A6FF">GitHub Contribution Streak</text>
  </g>

  <g transform="translate(25, 65)">
    <!-- Column 1: Total Contributions -->
    <rect x="0" y="0" width="138" height="110" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="69" y="32" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="600" font-size="13" fill="#8B949E">TOTAL</text>
    <text x="69" y="65" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="700" font-size="24" fill="#3FB950">151</text>
    <text x="69" y="90" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="11" fill="#6E7681">2025 - Present</text>

    <!-- Column 2: Current Streak -->
    <rect x="153" y="0" width="138" height="110" rx="8" fill="#161B22" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="222" y="32" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="600" font-size="13" fill="#58A6FF">CURRENT STREAK</text>
    <text x="222" y="65" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="700" font-size="24" fill="#58A6FF">42 Days 🔥</text>
    <text x="222" y="90" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="11" fill="#6E7681">Active Daily</text>

    <!-- Column 3: Longest Streak -->
    <rect x="306" y="0" width="138" height="110" rx="8" fill="#161B22" stroke="#30363D"/>
    <text x="375" y="32" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="600" font-size="13" fill="#8B949E">LONGEST STREAK</text>
    <text x="375" y="65" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="700" font-size="24" fill="#D29922">86 Days ⚡</text>
    <text x="375" y="90" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-weight="400" font-size="11" fill="#6E7681">All-Time Peak</text>
  </g>
