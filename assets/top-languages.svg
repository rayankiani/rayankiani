<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215" fill="none">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58A6FF; }
    .lang-name { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #C9D1D9; }
    .lang-pct { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8B949E; }
  </style>

  <rect x="0.5" y="0.5" rx="10" width="494" height="214" fill="#0D1117" stroke="#30363D"/>

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="title">Most Used Languages & Stack</text>
  </g>

  <g transform="translate(25, 60)">
    <!-- TypeScript -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="6" fill="#3178C6"/>
      <text x="20" y="10" class="lang-name">TypeScript</text>
      <text x="445" y="10" text-anchor="end" class="lang-pct">42%</text>
      <rect x="0" y="18" width="445" height="8" rx="4" fill="#21262D"/>
      <rect x="0" y="18" width="187" height="8" rx="4" fill="#3178C6"/>
    </g>

    <!-- React / JavaScript -->
    <g transform="translate(0, 36)">
      <circle cx="6" cy="6" r="6" fill="#F7DF1E"/>
      <text x="20" y="10" class="lang-name">JavaScript & React</text>
      <text x="445" y="10" text-anchor="end" class="lang-pct">28%</text>
      <rect x="0" y="18" width="445" height="8" rx="4" fill="#21262D"/>
      <rect x="0" y="18" width="124" height="8" rx="4" fill="#F7DF1E"/>
    </g>

    <!-- HTML & CSS / Tailwind -->
    <g transform="translate(0, 72)">
      <circle cx="6" cy="6" r="6" fill="#E34C26"/>
      <text x="20" y="10" class="lang-name">HTML / CSS / Tailwind</text>
      <text x="445" y="10" text-anchor="end" class="lang-pct">18%</text>
      <rect x="0" y="18" width="445" height="8" rx="4" fill="#21262D"/>
      <rect x="0" y="18" width="80" height="8" rx="4" fill="#E34C26"/>
    </g>

    <!-- Node.js / Firebase -->
    <g transform="translate(0, 108)">
      <circle cx="6" cy="6" r="6" fill="#3572A5"/>
      <text x="20" y="10" class="lang-name">Node.js & Backend Systems</text>
      <text x="445" y="10" text-anchor="end" class="lang-pct">12%</text>
      <rect x="0" y="18" width="445" height="8" rx="4" fill="#21262D"/>
      <rect x="0" y="18" width="54" height="8" rx="4" fill="#3572A5"/>
    </g>
  </g>
</svg>
